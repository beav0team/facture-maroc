org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.7.3 was published before API 36. The platform is installed and this
# app uses nothing that changed in it, so the warning is noise; the alternative
# is a Gradle + AGP upgrade that this release does not need.
android.suppressUnsupportedCompileSdk=36
